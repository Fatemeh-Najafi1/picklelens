[project]
name = "picklelens"
version = "0.1.0"
description = "AI-security toolkit: malicious model-file scanner (picklelens) + traitor-agent detector (agentaudit)"
requires-python = ">=3.10"
authors = [{ name = "motanjf", email = "motanjf@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
picklelens = "picklelens.cli:main"
agentaudit = "agentaudit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["picklelens*", "agentaudit*"]
